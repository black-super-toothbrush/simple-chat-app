<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telink B91 USB (CDC) Flasher</title>
  <style>
    :root { --bg:#0b1020; --card:#111831; --muted:#aab2d5; --acc:#6ee7ff; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,var(--bg),#090e1b);color:#e8edff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
    header{padding:24px 16px;text-align:center}
    h1{margin:0 0 8px;font-weight:800;letter-spacing:.5px}
    .wrap{max-width:1100px;margin:0 auto;padding:0 16px 48px}
    .card{background:var(--card);border:1px solid #1b2445;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3);margin:16px 0}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type="file"]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #213069;background:#0d1430;color:#e8edff}
    button{appearance:none;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:#13224b;color:#e8edff;border:1px solid #203168;transition:transform .05s ease,background .2s}
    button:hover{background:#182a5d}
    button.primary{background:linear-gradient(180deg,#1a7bd6,#1557a6);border-color:#2268c7}
    button.success{background:linear-gradient(180deg,#1e9e5a,#177a46);border-color:#1f9957}
    button.warn{background:linear-gradient(180deg,#f59e0b,#b16c01);border-color:#b16c01}
    button:disabled{opacity:.45;cursor:not-allowed}
    .muted{color:var(--muted)}
    .progress{height:12px;background:#0b1332;border-radius:999px;overflow:hidden;border:1px solid #203168}
    .bar{height:100%;width:0;background:linear-gradient(90deg,#37b3ff,#6ef2ff);transition:width .2s}
    .log{font-family:ui-monospace,Consolas,Menlo,monospace;background:#070b18;border:1px solid #1c274d;padding:12px;border-radius:12px;min-height:120px;white-space:pre-wrap;max-height:340px;overflow-y:auto;font-size:12px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #24376f;background:#0c1535;color:#cfe3ff;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .logs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:800px){ .logs{grid-template-columns:1fr} }
    h3{margin:4px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  </style>
</head>
<body>
  <header>
    <h1>Telink B91 USB Flasher</h1>
    <div class="muted">Web Serial port of cdc_ota_tool.py — app / ESP32 / bootloader updates over USB-CDC, plus one-click old-device migration</div>
  </header>
  <div class="wrap">
    <div class="card">
      <div class="grid">
        <div>
          <label>B91 app firmware</label>
          <span class="pill">B91_module.bin</span>
        </div>
        <div>
          <label>B91 prod firmware</label>
          <span class="pill">B91_module_PROD.bin</span>
        </div>
        <div>
          <label>B91 bootloader</label>
          <span class="pill">B91_bootloader.bin</span>
        </div>
        <div>
          <label>ESP32 firmware</label>
          <span class="pill">focus-v-firmware-wifi-esp-idf.bin</span>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="btnConnect" class="primary">Connect (USB)</button>
        <button id="btnMonitor" disabled>Open monitor</button>
        <button id="btnReset" disabled>Reset → DFU</button>
        <button id="btnReboot" disabled>Reboot → App</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btnApp" class="success" disabled>Update B91 App (DFU)</button>
        <button id="btnProd" class="success" disabled>Update B91 Prod (DFU)</button>
        <button id="btnBl" class="success" disabled>Update Bootloader (via App)</button>
        <button id="btnEsp" class="success" disabled>Update ESP32 (DFU)</button>
        <button id="btnMigrate" class="warn" disabled>Migrate old device (BL → App)</button>
      </div>
      <div class="row" style="margin-top:12px">
        <span class="pill" id="state">Idle</span>
        <span class="pill" id="speed"></span>
      </div>
      <div style="margin-top:12px">
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
      <div class="logs" style="margin-top:12px">
        <div><h3>PC log</h3><div class="log" id="log" aria-live="polite"></div></div>
        <div><h3>Device log</h3><div class="log" id="dlog"></div></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log  = (m) => { const el = $("log");  el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
  const dlog = (m) => { const el = $("dlog"); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
  const setState = (s) => { $("state").textContent = s; };
  const setSpeed = (s) => { $("speed").textContent = s; };
  const setProgress = (v) => { $("bar").style.width = Math.max(0, Math.min(100, v)) + "%"; };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  // ---- constants mirrored from cdc_ota_tool.py / the firmware ----
  const USB_VID = 0x248A, USB_PID = 0x8002;      // "Telink CDC"
  const PAGE_SIZE = 4096;                         // must match CDC_OTA_PAGE_SIZE
  const LIMITS = {                                // {min, max} bytes per target
    b91:  { min: 500*1024, max: 1024*1024, magic: "OTA!", name: "B91 app (flash 0x20000, in DFU)" },
    bldr: { min: 8*1024,   max: 124*1024,  magic: "BLDR", name: "B91 bootloader (flash 0x0000, via running app)" },
    esp:  { min: 1024*1024,max: 1843*1024, magic: "ESP!", name: "ESP32-S2 (forwarded over B91 UART1, in DFU)" },
  };
  // The DFU bootloader announces itself once a second while idle
  // (cdc_ota_idle_tick: "Hello world v21"). The running app never sends it.
  const DFU_HEARTBEAT = "Hello world";

  function adler32(data) {
    // zlib.adler32 equivalent; MOD 65521, chunked to keep sums in range.
    let a = 1, b = 0;
    const MOD = 65521;
    for (let i = 0; i < data.length;) {
      const end = Math.min(i + 3800, data.length);
      for (; i < end; i++) { a += data[i]; b += a; }
      a %= MOD; b %= MOD;
    }
    return (((b << 16) >>> 0) | a) >>> 0;
  }

  const u32le = (v) => new Uint8Array([v & 0xFF, (v>>>8)&0xFF, (v>>>16)&0xFF, (v>>>24)&0xFF]);

  // ------------------------- serial plumbing -------------------------
  // One read pump per open port: splits '\n' lines into a FIFO consumed by
  // readLine(); every line is also echoed to the Device log when the
  // monitor is on.
  //
  // Lessons from the python tool (cdc_ota_tool.py), which never drops the
  // link, versus this page, which used to "connect for a second and then
  // disconnect" on the ESP32 path:
  //  * pyserial ignores the OS's non-fatal line-error flags entirely. Web
  //    Serial surfaces them as BufferOverrunError / FramingError /
  //    BreakError / ParityError rejections of reader.read(); the port is
  //    still open (port.readable is non-null) and the correct reaction is
  //    to grab a new reader and carry on. The old pump treated ANY read
  //    error as "device rebooted" and closed the port.
  //  * the global navigator.serial "disconnect" event fires for EVERY
  //    granted device. After "reset" the app-mode port goes away, and if
  //    Windows delivers that removal AFTER we already reopened the new
  //    bootloader port, a port-agnostic handler tore down the fresh link.
  //    Now the event is only honoured for the port we currently hold.
  //  * closing a port while its reader is still locked makes port.close()
  //    reject (silently swallowed before), so the old port object stayed
  //    open in Chrome. The teardown now cancels the reader, waits for the
  //    pump to exit, and really closes the port.
  //  * every disconnect path now logs WHICH path fired, the error name and
  //    message, and the protocol stage, so a failure is self-diagnosing.
  let port = null, writer = null, reader = null, pumpDone = null;
  let lineFifo = [], lineWaiter = null;
  let monitorOn = false;
  let connected = false;
  let busy = false;
  let stage = "idle";            // protocol stage, for diagnostics
  let lostReason = "";           // why the last port went away
  const setStage = (s) => { stage = s; };

  function pushLine(line) {
    if (monitorOn) dlog(line.startsWith("LOG ") ? line.slice(4) : line);
    lineFifo.push(line);
    if (lineWaiter) { const w = lineWaiter; lineWaiter = null; w(); }
  }

  async function readPump(p) {
    let buf = "";
    let fatal = null;
    let glitches = 0;
    try {
      // Standard Web Serial loop: a non-fatal error errors the current
      // ReadableStream but leaves port.readable available (a fresh stream),
      // so re-acquire a reader and keep going. Only a null port.readable
      // (device lost / port closed) ends the pump.
      while (port === p && p.readable) {
        const r = p.readable.getReader();
        reader = r;
        let closed = false;
        try {
          for (;;) {
            const { value, done } = await r.read();
            if (done) { closed = true; break; }
            glitches = 0;
            buf += dec.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf("\n")) >= 0) {
              pushLine(buf.slice(0, nl).replace(/\r$/, ""));
              buf = buf.slice(nl + 1);
            }
          }
        } catch (e) {
          if (port === p && p.readable && ++glitches <= 50) {
            log(`Serial read glitch (${e.name}: ${e.message}) during '${stage}' - non-fatal, link kept.`);
            await sleep(20);
            continue;
          }
          fatal = e;
        } finally {
          try { r.releaseLock(); } catch (_) {}
          if (reader === r) reader = null;
        }
        if (closed || fatal) break;
      }
    } finally {
      if (port === p) {
        const why = fatal ? `read failed (${fatal.name}: ${fatal.message})` : "read stream closed";
        await onPortLost(p, `Port lost during '${stage}': ${why}.`);
      }
    }
  }

  // Device-initiated loss (reboot / unplug / fatal read error). Idempotent
  // and port-specific: a stale event for an older port object is ignored.
  async function onPortLost(p, msg) {
    if (port !== p) return;
    port = null; connected = false; lostReason = msg;
    try { if (writer) writer.releaseLock(); } catch (_) {}
    writer = null; reader = null;
    try { await p.close(); } catch (_) { /* already gone */ }
    if (msg) log(msg);
    setState("Disconnected");
    updateButtons();
  }

  // Host-initiated close: cancel the reader, let the pump exit, close.
  async function closePort(msg) {
    const p = port;
    if (!p) return;
    port = null; connected = false; lostReason = msg || "closed by host";
    try { if (reader) await reader.cancel(); } catch (_) {}
    try { if (writer) writer.releaseLock(); } catch (_) {}
    writer = null; reader = null;
    try { if (pumpDone) await pumpDone; } catch (_) {}
    pumpDone = null;
    try { await p.close(); } catch (e) { log(`(close note: ${e.name}: ${e.message})`); }
    if (msg) log(msg);
    setState("Disconnected");
    updateButtons();
  }

  async function openPort(p) {
    await p.open({ baudRate: 115200, bufferSize: 16384 });
    try { await p.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch (_) {}
    port = p;
    writer = p.writable.getWriter();
    lineFifo = []; lineWaiter = null;
    connected = true; lostReason = "";
    pumpDone = readPump(p); // runs until the port dies or we close it
    const info = p.getInfo();
    log(`Opened Telink CDC port (VID 0x${(info.usbVendorId||0).toString(16)} PID 0x${(info.usbProductId||0).toString(16)}).`);
    setState("Connected");
    updateButtons();
  }

  async function connect() {
    try {
      const p = await navigator.serial.requestPort({
        filters: [{ usbVendorId: USB_VID, usbProductId: USB_PID }]
      });
      await openPort(p);
    } catch (e) {
      log("Connect: " + e.message);
    }
  }

  // Wait (up to maxMs) for the CURRENT port to go away after we told the
  // device to reboot. Resolves true if it dropped, false if it is still
  // there (e.g. the command was ignored because the device was already in
  // the mode we asked for).
  async function awaitDrop(maxMs) {
    const t0 = Date.now();
    while (Date.now() - t0 < maxMs) {
      if (!port) return true;
      await sleep(100);
    }
    return false;
  }

  // After a device-initiated reboot the device re-enumerates. Chrome only
  // auto-reopens ports the user has ALREADY granted, and the grant is keyed
  // on VID+PID+USB serial string. On old firmware the app reports serial
  // "CDC demo" but the bootloader "CDC demo " (trailing space), so the first
  // trip through a reboot looks like a brand-new device and getPorts() never
  // returns it. Phase 1 polls getPorts(); phase 2 falls back to a one-time
  // manual Connect click - Chrome remembers that grant, so every later
  // reboot in either direction reconnects automatically.
  //
  // `oldPort` is the port object we just lost: a re-enumerated device gets a
  // NEW SerialPort object, and the old one can linger in getPorts() for a
  // moment before Chrome processes the removal. Reopening THAT one would
  // "connect" to a device that is about to vanish - exactly the
  // connect-then-drop symptom - so it is skipped.
  async function reconnect(maxMs = 12000, oldPort = null) {
    setState("Reconnecting…");
    let t0 = Date.now();
    while (Date.now() - t0 < maxMs) {
      if (connected) return true;   // user beat us to it via [Connect]
      const ports = await navigator.serial.getPorts();
      for (const p of ports) {
        // Skip the old instance for the first 3s; if it is STILL the only
        // one after that the device never re-enumerated (command ignored),
        // so reopening it is the right thing to do.
        if (p === oldPort && Date.now() - t0 < 3000) continue;
        if (p.connected === false) continue;   // Chrome 117+: enumerated but not present
        const i = p.getInfo();
        if (i.usbVendorId === USB_VID && i.usbProductId === USB_PID) {
          try { await openPort(p); return true; } catch (_) { /* not up yet */ }
        }
      }
      await sleep(400);
    }
    log("Auto-reconnect found no authorized port. Chrome hasn't been granted THIS mode's USB identity yet (old firmware: app and bootloader use different USB serial strings).");
    log(">>> Click [Connect] and pick the 'Telink CDC' port to continue. One time per device - Chrome remembers the grant afterwards.");
    setState("Click Connect to continue…");
    t0 = Date.now();
    while (Date.now() - t0 < 120000) {
      if (connected) { log("Port granted - continuing."); return true; }
      await sleep(300);
    }
    return false;
  }

  async function write(bytes) {
    if (!writer) throw new Error("not connected" + (lostReason ? ` (${lostReason})` : ""));
    await writer.write(bytes instanceof Uint8Array ? bytes : enc.encode(bytes));
  }

  function readLine(timeoutMs) {
    return new Promise((resolve) => {
      if (lineFifo.length) return resolve(lineFifo.shift());
      let t = setTimeout(() => { lineWaiter = null; resolve(null); }, timeoutMs);
      lineWaiter = () => { clearTimeout(t); resolve(lineFifo.shift()); };
    });
  }

  // Read until a protocol response: "OK" -> true, "ERR"/"FAIL" -> throw,
  // "LOG ..." -> device log, anything else -> device chatter.
  async function readResponse(timeoutMs) {
    const deadline = Date.now() + timeoutMs;
    for (;;) {
      const remaining = deadline - Date.now();
      if (remaining <= 0) throw new Error("timed out waiting for device response");
      if (!connected) throw new Error("port dropped while waiting for device response" + (lostReason ? ` (${lostReason})` : ""));
      const line = await readLine(Math.min(remaining, 500));
      if (line === null) continue;
      if (line === "") continue;
      if (line.startsWith("LOG ")) { dlog(line.slice(4)); continue; }
      if (line === "OK") return true;
      if (line.startsWith("ERR") || line.startsWith("FAIL")) throw new Error("device reported: " + line);
      dlog(line);
    }
  }

  // ------------------------- protocol actions -------------------------

  // Listen for `ms` and report whether the DFU bootloader heartbeat showed
  // up. Returns { seen, dfu }: seen = any line at all, dfu = heartbeat.
  async function listen(ms) {
    let seen = false, dfu = false;
    const t0 = Date.now();
    while (Date.now() - t0 < ms) {
      const line = await readLine(ms - (Date.now() - t0));
      if (line === null) break;
      if (line) {
        dlog(line.startsWith("LOG ") ? line.slice(4) : line);
        seen = true;
        if (line.includes(DFU_HEARTBEAT)) dfu = true;
      }
    }
    return { seen, dfu };
  }

  async function heartbeatCheck() {
    setStage("heartbeat");
    log("Listening for device heartbeat (1.5s)…");
    const r = await listen(1500);
    log(r.dfu  ? "DFU bootloader heartbeat detected - link OK."
      : r.seen ? "Device is talking, but no DFU heartbeat seen - continuing anyway…"
      :          "WARNING: no heartbeat. Is the device in the bootloader (DFU) with CDC-OTA? Trying anyway…");
    return r;
  }

  // START / DATA / VERIFY - the exact cdc_ota_tool.py sequence.
  async function flashFirmware(target, data, opts = {}) {
    const cfg = LIMITS[target];
    const size = data.length;
    if (size === 0) throw new Error("file is empty");
    if (size < cfg.min || size > cfg.max)
      throw new Error(`${cfg.name}: size ${Math.round(size/1024)}KB outside ${cfg.min/1024}..${cfg.max/1024}KB - wrong .bin?`);

    const checksum = adler32(data);
    log(`File size : ${size} bytes (${(size/1024).toFixed(1)} KB)`);
    log(`Dest      : ${cfg.name}`);
    if (target !== "esp") log(`Adler32   : 0x${checksum.toString(16).padStart(8, "0")}`);

    lineFifo = [];
    if (opts.dfuConfirmed) log("DFU bootloader heartbeat already confirmed - skipping the second probe.");
    else await heartbeatCheck();

    // ---- START ----
    // The magic and the size MUST go out in ONE write/USB transfer: the
    // app's CDC dispatcher routes a packet to the BLDR handler only if the
    // packet STARTS with the magic - a size-only follow-up packet would be
    // dropped as an unknown text command and the 8-byte frame never
    // completes (and its 4 leftover magic bytes then corrupt the NEXT
    // attempt's size field -> "ERR bad size").
    setStage("START");
    log("-> START" + (target === "esp" ? " (ESP32 erases an OTA partition first, may take ~15s)" : ""));
    const startFrame = new Uint8Array(8);
    startFrame.set(enc.encode(cfg.magic), 0);
    startFrame.set(u32le(size), 4);
    await write(startFrame);
    // The bootloader blocks in esp_ota_begin() for up to 15s (no USB
    // servicing at all) before it answers; give it the full window.
    await readResponse(target === "esp" ? 20000 : 3000);
    log("<- OK (device ready)");

    // ---- DATA ----
    const t0 = performance.now();
    let offset = 0, blockNo = 0;
    const totalBlocks = Math.ceil(size / PAGE_SIZE);
    const report = () => {
      const dt = (performance.now() - t0) / 1000;
      const spd = dt > 0 ? (offset / 1024) / dt : 0;
      const eta = spd > 0 ? ((size - offset) / 1024) / spd : 0;
      setProgress(Math.round(offset * 100 / size));
      setSpeed(`${spd.toFixed(1)} KB/s  ETA ${eta.toFixed(0)}s`);
      setStage(`DATA ${Math.floor(offset*100/size)}%`);
      return spd;
    };

    if (target === "esp") {
      // Streaming, no per-block ACK: writer.write() only resolves when the
      // OS accepted the bytes, and the B91 NAKs its OUT endpoint while it
      // forwards to the ESP32 - natural flow control, same as the python
      // tool's blocking serial writes.
      setStage("DATA 0%");
      while (offset < size) {
        if (!connected) throw new Error("port dropped mid-transfer" + (lostReason ? ` (${lostReason})` : ""));
        const n = Math.min(PAGE_SIZE, size - offset);
        await write(data.subarray(offset, offset + n));
        offset += n; blockNo++;
        if (blockNo % 16 === 0 || offset >= size) {
          const spd = report();
          log(`   sent ${offset}/${size} bytes (${Math.floor(offset*100/size)}%)  ${spd.toFixed(1)} KB/s`);
        }
      }
    } else {
      // Per-4KB-block ACK: the device erases+programs one sector per block.
      setStage("DATA 0%");
      while (offset < size) {
        if (!connected) throw new Error("port dropped mid-transfer" + (lostReason ? ` (${lostReason})` : ""));
        const n = Math.min(PAGE_SIZE, size - offset);
        await write(data.subarray(offset, offset + n));
        await readResponse(5000);
        offset += n; blockNo++;
        report();
        if (blockNo % 16 === 0 || offset >= size)
          log(`   programmed ${offset}/${size} bytes (${Math.floor(offset*100/size)}%)  block ${blockNo}/${totalBlocks}`);
      }
    }
    const dt = (performance.now() - t0) / 1000;
    log(`All blocks ${target === "esp" ? "sent" : "programmed"} in ${dt.toFixed(1)}s (${(size/1024/dt).toFixed(1)} KB/s)`);

    // ---- FINISH / VERIFY ----
    // Both targets reboot the B91 on success, so a port drop right after
    // (or instead of) the OK means the update PASSED.
    setStage(target === "esp" ? "FINISH" : "VERIFY");
    log(target === "esp" ? "-> FINISH (ESP32 commits + reboots; B91 reboots out of DFU)"
                         : "-> VERIFY (Adler-32 read-back on device, then reboot)");
    try {
      const crcFrame = new Uint8Array(8);   // single write, same reason as START
      crcFrame.set(enc.encode("CRC?"), 0);
      crcFrame.set(u32le(checksum), 4);
      if (target === "esp") {
        // Drain before the finish frame. writer.write() resolves when the
        // bytes enter Chrome's outgoing buffer (bufferSize), NOT when they
        // reach the device, and Chrome coalesces everything buffered into
        // one OS write. Sent back-to-back with the image tail, the 8-byte
        // CRC? frame lands mid-USB-packet right behind the last data bytes,
        // and the device - which stops counting at `size` and drops the rest
        // of that packet - never sees it, so FINISH times out. pyserial does
        // one OS write per write() call (own USB transfer), which is why the
        // python tool never hits this. ~16KB of buffer at ~33KB/s clears in
        // <1s; 2s is a safe margin. (b91/bldr are immune: their per-block OK
        // means the buffer is already empty when CRC? goes out.)
        await sleep(2000);
      }
      await write(crcFrame);
      // Firmware worst case for the ESP finish is esp_ota_finish(): one 10s
      // wait plus four 3s retries = 22s, so 30s here avoids a spurious resend.
      const finishTimeout = target === "esp" ? 30000 : 20000;
      try {
        await readResponse(finishTimeout);
      } catch (e) {
        if (target === "esp" && connected && /timed out/.test(e.message)) {
          // Belt-and-suspenders: if the frame still got swallowed the device
          // is parked in DONE waiting for a command - a clean resend works.
          log("No FINISH response - resending the finish frame once…");
          await write(crcFrame);
          await readResponse(finishTimeout);
        } else {
          throw e;
        }
      }
      log("*** " + (target === "esp" ? "ESP32 UPDATE OK" : "VERIFY OK") + " *** device is rebooting.");
    } catch (e) {
      if (!connected) {
        log("Port dropped during verify - the device reboots on success, so this almost certainly PASSED.");
      } else {
        throw e;
      }
    }
    setProgress(100);
    setStage("done");
  }

  // "reset\n" to the RUNNING APP -> RESET-ACK -> reboots into the DFU
  // bootloader; then reopen the re-enumerated port.
  async function resetToDfu() {
    lineFifo = [];
    setStage("reset");
    const oldPort = port;
    log("-> 'reset' (app reboots into the DFU bootloader)…");
    await write("reset\n");
    const deadline = Date.now() + 1500;
    let acked = false;
    while (Date.now() < deadline && connected) {
      const line = await readLine(deadline - Date.now());
      if (line === null) break;
      if (line.includes("RESET-ACK")) { acked = true; break; }
      if (line) dlog(line.startsWith("LOG ") ? line.slice(4) : line);
    }
    log(acked ? "<- RESET-ACK. Device is rebooting into the bootloader…"
              : "WARNING: no RESET-ACK (is the running app's CDC alive?). Watching for re-enumeration anyway…");
    // Let the device drop the port itself (that is the proof it rebooted);
    // only force-close if it is still here after 3s.
    setStage("await drop");
    const dropped = await awaitDrop(3000);
    if (dropped) log("Old port is gone - waiting for the bootloader to enumerate…");
    else {
      log("Port did not drop by itself - the device did not reboot. Closing it and looking for the bootloader anyway…");
      if (!acked) log("HINT: no RESET-ACK and no reboot. If an earlier attempt failed mid-transfer, the bootloader is stuck consuming every byte as image data (state RECV, heartbeat silent) - power-cycle the device and retry.");
      await closePort(null);
    }
    await sleep(1200);
    setStage("reconnect");
    if (!(await reconnect(12000, oldPort))) throw new Error("device did not re-enumerate after reset");
    if (!dropped && port === oldPort) {
      // Same USB instance came back = the device never rebooted, i.e. it was
      // already the bootloader (one without a heartbeat) and our 6-byte
      // "reset" + newline is now sitting in its 8-byte command buffer. Two
      // filler newlines make the frame "complete" as unknown, which resets
      // that buffer so the following START frame is parsed cleanly.
      log("Same port reopened - device did not reboot (already in DFU?); resyncing its command buffer.");
      await write(new Uint8Array([0x0A, 0x0A]));
      await sleep(200);
      lineFifo = [];
      return;
    }
    log("Reconnected to the bootloader CDC.");
  }

  // Make sure the DFU BOOTLOADER is on the port. The python tool's
  // "Update ESP32" is always run against a device already sitting in DFU;
  // mirror that: probe for the bootloader heartbeat first and only send
  // "reset" when the running app is what answered. (Sending "reset\n" to
  // the bootloader would leave 6 stray bytes in its command buffer and
  // corrupt the following 8-byte START frame.)
  async function ensureDfuMode() {
    setStage("probe");
    lineFifo = [];
    log("Checking which firmware is on the port (1.5s)…");
    const r = await listen(1500);
    if (r.dfu) {
      log("Device is already in the DFU bootloader - no reset needed.");
      return true;
    }
    log(r.seen ? "Running app detected." : "No heartbeat - assuming the running app.");
    await resetToDfu();
    // Give the freshly enumerated bootloader a moment to settle before the
    // first command (the python flow has a human-scale pause here).
    setStage("settle");
    await sleep(2000);
    return false;
  }

  // "reboot" to the BOOTLOADER -> clears the OTA flag, reboots to the app.
  async function rebootToApp() {
    setStage("reboot");
    const oldPort = port;
    log("-> 'reboot' (bootloader clears its OTA flag and restarts)…");
    try { await write("reboot"); } catch (_) {}
    if (!(await awaitDrop(3000))) await closePort(null);
    await sleep(1200);
    if (await reconnect(12000, oldPort)) log("Device is back (running the app).");
    else log("Device did not come back as a CDC port - it may be booting the app without CDC; check the device.");
  }

  // Make sure the RUNNING APP is on the port: "reboot" is ignored by the
  // app (unknown text command) but kicks a DFU bootloader back into the
  // app - so after this we are in the app either way.
  async function ensureAppMode() {
    log("Making sure the device is running the app…");
    setStage("ensure app");
    lineFifo = [];
    const oldPort = port;
    try { await write("reboot"); } catch (_) {}
    if (await awaitDrop(2500)) {
      log("Device was sitting in the DFU bootloader - it is rebooting into the app…");
      await sleep(1000);
      if (!(await reconnect(12000, oldPort))) throw new Error("device did not come back after 'reboot'");
      await sleep(500);
    }
  }

  // One-click OLD-DEVICE migration, entirely over USB, BOOTLOADER FIRST.
  // A USB-powered device never auto-sleeps, so every reconnect is reliable:
  //   1. ensure the app is running (BLDR is received by the app)
  //   2. BLDR     : flash the NEW bootloader through the running app -
  //                 Adler-32 verified on the device BEFORE it reboots, so a
  //                 bad transfer leaves the old bootloader untouched and the
  //                 app alive for a safe retry. On success the device
  //                 reboots and the NEW bootloader jumps back into the app.
  //   3. "reset"  : app -> DFU (already the NEW bootloader, so its USB
  //                 identity matches the app's and reconnect is automatic)
  //   4. OTA!     : flash the NEW app, device verifies + reboots into it.
  async function migrate() {
    const appData = await fetchFirmware("app",  "new B91 app firmware");
    const blData  = await fetchFirmware("bldr", "new B91 bootloader");

    log("=== USB migration 1/2: bootloader (via the running app) ===");
    await ensureAppMode();
    let oldPort = port;
    await flashFirmware("bldr", blData);

    log("Waiting for the device to reboot (new bootloader -> app)…");
    if (!(await awaitDrop(5000))) await closePort(null);
    await sleep(1500);
    if (!(await reconnect(15000, oldPort))) throw new Error("device did not come back after the bootloader update - reconnect manually and use 'Update App firmware' to finish the migration.");

    log("=== USB migration 2/2: app firmware (via DFU) ===");
    await sleep(500);
    await ensureDfuMode();
    oldPort = port;
    await flashFirmware("b91", appData);

    log("Waiting for the device to reboot into the new app…");
    if (!(await awaitDrop(5000))) await closePort(null);
    await sleep(1500);
    if (await reconnect(15000, oldPort)) log("New app is up - migration verified.");
    else log("Device did not reappear within 15s - power-cycle it and check; the flash itself verified OK.");
    log("=== Migration complete: new bootloader + new app. ===");
    setState("Migrated");
  }

  // ------------------------- UI glue -------------------------

  // Fixed firmware images served next to this page.
  const FIRMWARE_FILES = {
    app:  "B91_module.bin",
    prod: "B91_module_PROD.bin",
    bldr: "B91_bootloader.bin",
    esp:  "focus-v-firmware-wifi-esp-idf.bin",
  };

  async function fetchFirmware(key, name) {
    const url = FIRMWARE_FILES[key];
    log(`Fetching ${name}: ${url} …`);
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(`failed to fetch ${url} (HTTP ${r.status})`);
    const data = new Uint8Array(await r.arrayBuffer());
    log(`Loaded ${url}: ${data.length} bytes (${(data.length/1024).toFixed(1)} KB)`);
    return data;
  }

  function updateButtons() {
    const on = connected && !busy;
    $("btnMonitor").disabled = !connected || busy;
    $("btnReset").disabled = !on;
    $("btnReboot").disabled = !on;
    $("btnApp").disabled = !on;
    $("btnProd").disabled = !on;
    $("btnBl").disabled = !on;
    $("btnEsp").disabled = !on;
    $("btnMigrate").disabled = !on;
    $("btnConnect").disabled = connected;
  }

  function run(name, fn) {
    return async () => {
      if (busy) return;
      busy = true; updateButtons();
      setProgress(0); setSpeed("");
      log("=".repeat(56));
      try {
        await fn();
        setState("Done");
        log("==== DONE ====");
      } catch (e) {
        log("ERROR: " + e.message + `  [stage: ${stage}]`);
        setState("Error");
        log("==== FAILED ====");
      } finally {
        busy = false; setStage("idle"); updateButtons();
      }
    };
  }

  $("btnConnect").addEventListener("click", async () => {
    if (!("serial" in navigator)) { log("Web Serial not available - use Chrome/Edge on desktop over HTTPS or localhost."); return; }
    await connect();
  });

  $("btnMonitor").addEventListener("click", () => {
    monitorOn = !monitorOn;
    $("btnMonitor").textContent = monitorOn ? "Close monitor" : "Open monitor";
    log(monitorOn ? "Monitor ON - device lines stream to the Device log." : "Monitor OFF.");
  });

  $("btnReset").addEventListener("click", run("reset", resetToDfu));
  $("btnReboot").addEventListener("click", run("reboot", rebootToApp));
  $("btnApp").addEventListener("click", run("app", async () => {
    const d = await fetchFirmware("app", "B91 app firmware");
    const dfuConfirmed = await ensureDfuMode();
    setState("Flashing app…");
    await flashFirmware("b91", d, { dfuConfirmed });
  }));
  $("btnProd").addEventListener("click", run("prod", async () => {
    const d = await fetchFirmware("prod", "B91 prod firmware");
    const dfuConfirmed = await ensureDfuMode();
    setState("Flashing prod…");
    await flashFirmware("b91", d, { dfuConfirmed });
  }));
  $("btnBl").addEventListener("click", run("bldr", async () => {
    const d = await fetchFirmware("bldr", "B91 bootloader");
    setState("Flashing bootloader…");
    await flashFirmware("bldr", d);
  }));
  $("btnEsp").addEventListener("click", run("esp", async () => {
    const d = await fetchFirmware("esp", "ESP32 firmware");
    const dfuConfirmed = await ensureDfuMode();
    setState("Flashing ESP32…");
    await flashFirmware("esp", d, { dfuConfirmed });
  }));
  $("btnMigrate").addEventListener("click", run("migrate", migrate));

  if ("serial" in navigator) {
    // Port-specific: the event bubbles up from the SerialPort that went
    // away. A removal notice for an OLD port (delivered after we already
    // reopened the re-enumerated device) must not kill the new link.
    navigator.serial.addEventListener("disconnect", (e) => {
      if (port && e.target === port) onPortLost(port, `USB device disconnected (event) during '${stage}'.`);
      else log(`(disconnect event for a previous port instance during '${stage}' - ignored)`);
    });
    // Auto-reopen a previously granted port on page load for convenience.
    (async () => {
      const ports = await navigator.serial.getPorts();
      for (const p of ports) {
        if (p.connected === false) continue;
        const i = p.getInfo();
        if (i.usbVendorId === USB_VID && i.usbProductId === USB_PID) {
          try { await openPort(p); break; } catch (_) {}
        }
      }
    })();
  } else {
    log("Web Serial not available - use Chrome/Edge on desktop (HTTPS or localhost).");
  }
})();
</script>
</body>
</html>
